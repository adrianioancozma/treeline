[package]
name = "treeline-helper"
version = "0.3.2"
description = "Runs Treeline's git layer next to repositories on another computer; talks JSON-RPC over stdin/stdout"
edition = "2024"

[dependencies]
treeline-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
